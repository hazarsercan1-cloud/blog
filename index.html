<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitoox — Teknoloji ve Oyun Dünyasından Trendler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menü -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">⚡</div>
                Kitoox
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link active">Haberler</a>
                <a href="#" class="nav-link">Teknoloji</a>
                <a href="#" class="nav-link">Oyun</a>
                <a href="#" class="nav-link">Donanım</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Manşetler (Grid) -->
        <section class="hero-grid" id="heroGrid">
            <!-- JavaScript ile doldurulacak -->
        </section>

        <div class="content-layout">
            <!-- Sol Taraf (Haber Akışı) -->
            <div class="main-feed">
                <h2 class="section-title">Son Eklenenler</h2>
                <div class="post-list" id="postList">
                    <!-- JavaScript ile doldurulacak -->
                </div>
            </div>

            <!-- Sağ Taraf (Sidebar) -->
            <aside class="sidebar">
                <div class="sidebar-widget">
                    <h3 class="widget-title">🔥 En Çok Okunanlar</h3>
                    <div class="popular-list" id="popularList">
                        <!-- JavaScript ile doldurulacak -->
                    </div>
                </div>

                <div class="sidebar-widget" style="background: var(--accent-gradient); color: white;">
                    <h3 class="widget-title" style="color: white; border-color: rgba(255,255,255,0.2);">Kitoox Bülten</h3>
                    <p style="font-size: 14px; margin-bottom: 16px; opacity: 0.9;">En yeni teknoloji haberleri ve trendler her hafta e-postana gelsin.</p>
                    <input type="email" placeholder="E-posta adresin" style="width: 100%; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                    <button style="width: 100%; padding: 10px; background: white; color: var(--accent); border-radius: 6px; font-weight: bold;">Abone Ol</button>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background: white; border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center;">
        <div style="font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 16px;">
            Kitoox
        </div>
        <div style="display: flex; justify-content: center; gap: 20px; font-size: 14px; color: var(--text-muted);">
            <a href="#">Hakkımızda</a>
            <a href="#">İletişim</a>
            <a href="#">Gizlilik Politikası</a>
            <a href="#">Reklam</a>
        </div>
        <p style="margin-top: 24px; font-size: 13px; color: #94a3b8;">© 2026 Kitoox.com. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
