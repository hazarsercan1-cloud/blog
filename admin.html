<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitoox CMS — Firebase Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <div class="logo"><div class="logo-icon">🔥</div>Kitoox CMS</div>
            <a href="index.html" class="btn-primary" style="padding: 8px 16px; font-size: 14px;">Ana Siteye Git</a>
        </div>
    </nav>

    <!-- Giriş (Şifre) Ekranı - Basit Güvenlik -->
    <div id="loginScreen" style="position:fixed; inset:0; background:var(--bg-main); z-index:999; display:flex; align-items:center; justify-content:center;">
        <div class="admin-card" style="text-align:center; max-width:400px; width:100%;">
            <div style="font-size:40px; margin-bottom:20px;">🔒</div>
            <h2 class="admin-title">Yönetici Girişi</h2>
            <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">Sadece Kitoox yöneticisi erişebilir.</p>
            <input type="password" id="adminPass" class="form-control" placeholder="Yönetici Şifresi" style="margin-bottom:16px;">
            <button class="btn-primary" onclick="checkPass()" style="width:100%; justify-content:center;">Giriş Yap</button>
        </div>
    </div>

    <!-- Admin Paneli Ana İçerik -->
    <div class="admin-container" id="adminPanel" style="display:none;">
        <div class="admin-card">
            <h1 class="admin-title">Yeni Haber Yayımla</h1>
            
            <div id="statusAlert" style="display:none; padding:16px; border-radius:8px; margin-bottom:24px; font-weight:600;"></div>
            
            <!-- TEMEL BİLGİLER -->
            <div class="form-group">
                <label class="form-label">Başlık</label>
                <input type="text" id="postTitle" class="form-control" placeholder="Haberin çarpıcı başlığı...">
            </div>

            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Kategori</label>
                    <select id="postCat" class="form-control">
                        <option value="Teknoloji">Teknoloji</option>
                        <option value="Oyun">Oyun</option>
                        <option value="Donanım">Donanım</option>
                        <option value="Sosyal Medya">Sosyal Medya</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Seçenekler</label>
                    <div style="display: flex; gap: 16px; margin-top: 10px;">
                        <label style="font-weight: 600;"><input type="checkbox" id="postTrend"> 🔥 Trend Haber</label>
                        <label style="font-weight: 600;"><input type="checkbox" id="postHeadline" checked> ⭐️ Manşet</label>
                    </div>
                </div>
            </div>

            <div class="form-group" style="background:#f8fafc; padding:16px; border-radius:8px; border:1px solid var(--border);">
                <label class="form-label">Manşet Görseli (Ana Ekran Fotoğrafı)</label>
                <input type="file" id="postThumbFile" class="form-control" accept="image/*" style="margin-bottom:8px;">
                <div style="font-size:12px; color:var(--text-muted);">Fotoğraf seçtiğinizde Firebase'e otomatik yüklenir. Eğer internetten link kullanacaksanız dosyayı boş bırakıp alttaki link kutusunu kullanın.</div>
                <input type="text" id="postThumbLink" class="form-control" placeholder="Veya internet linki (https://...)" style="margin-top:8px;">
            </div>

            <div class="form-group">
                <label class="form-label">Özet (Ana sayfada başlığın altında görünecek kısa yazı)</label>
                <textarea id="postExcerpt" class="form-control" rows="3" placeholder="Özet metni buraya yazın..."></textarea>
            </div>

            <!-- BLOK DÜZENLEYİCİ -->
            <div class="builder-area">
                <h2 class="admin-title" style="font-size: 20px; margin-bottom: 16px; border: none; padding: 0;">İçerik Blokları</h2>
                <div class="builder-toolbar">
                    <button class="btn-block" onclick="addBlock('text')">📝 Metin Ekle</button>
                    <button class="btn-block" onclick="addBlock('title2')">H2 Alt Başlık Ekle</button>
                    <button class="btn-block" onclick="addBlock('image')">🖼️ Resim Ekle</button>
                    <button class="btn-block" onclick="addBlock('youtube')">▶️ YouTube Ekle</button>
                </div>

                <div class="blocks-container" id="blocksContainer">
                    <!-- Dinamik bloklar -->
                </div>
            </div>

            <div style="margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);">
                <button class="btn-primary" id="publishBtn" style="width: 100%; justify-content: center; font-size:18px;">🚀 Haberi Buluta Kaydet (Canlı Yayımla)</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK ve Mantık -->
    <script type="module">
        import { db, storage, collection, addDoc, serverTimestamp, ref, uploadBytesResumable, getDownloadURL } from './firebase-config.js';

        // Güvenlik: Basit Şifre Koruması (Sadece bu sayfayı GitHub'a yüklemezseniz güvendedir)
        window.checkPass = function() {
            const pass = document.getElementById('adminPass').value;
            // Eğitim amaçlı şifre 'kitoox2026' olarak ayarlandı
            if(pass === 'kitoox2026') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                addBlock('text'); // İlk bloğu ekle
            } else {
                alert("Hatalı Şifre!");
            }
        }

        let blockCounter = 0;
        const blocksContainer = document.getElementById('blocksContainer');

        window.addBlock = function(type) {
            blockCounter++;
            const id = 'block_' + blockCounter;
            const div = document.createElement('div');
            div.className = 'editor-block';
            div.id = id;

            let html = '';
            if (type === 'text') {
                html = `<span class="block-type-label">METİN</span><textarea class="form-control block-val" rows="4" placeholder="Metin..."></textarea>`;
            } else if (type === 'title2') {
                html = `<span class="block-type-label">ALT BAŞLIK</span><input type="text" class="form-control block-val" placeholder="H2 Başlık">`;
            } else if (type === 'image') {
                html = `
                    <span class="block-type-label">RESİM (Firebase'e Yüklenecek)</span>
                    <input type="file" class="form-control block-file" accept="image/*" style="margin-bottom:8px;">
                    <div style="font-size:12px; margin-bottom:8px;">Veya Link:</div>
                    <input type="text" class="form-control block-val block-link" placeholder="https://...">
                    <input type="text" class="form-control block-caption" placeholder="Resim Alt Yazısı" style="margin-top:8px;">
                `;
            } else if (type === 'youtube') {
                html = `<span class="block-type-label">YOUTUBE</span><input type="text" class="form-control block-val" placeholder="Embed Linki (https://www.youtube.com/embed/...)">`;
            }

            div.innerHTML = `
                <div class="block-content-edit" data-type="${type}">
                    ${html}
                </div>
                <button class="btn-remove-block" onclick="document.getElementById('${id}').remove()">✖</button>
            `;
            blocksContainer.appendChild(div);
        }

        // Resmi Firebase Storage'a yükleyip linkini geri veren fonksiyon
        async function uploadImageToFirebase(file) {
            if(!file) return null;
            const fileName = new Date().getTime() + '_' + file.name;
            const storageRef = ref(storage, 'images/' + fileName);
            const uploadTask = await uploadBytesResumable(storageRef, file);
            const downloadURL = await getDownloadURL(uploadTask.ref);
            return downloadURL;
        }

        // Kaydetme İşlemi
        document.getElementById('publishBtn').addEventListener('click', async () => {
            const btn = document.getElementById('publishBtn');
            const alertBox = document.getElementById('statusAlert');
            
            const title = document.getElementById('postTitle').value;
            if(!title) return alert("Başlık boş olamaz!");

            btn.disabled = true;
            btn.innerHTML = '⏳ Yükleniyor... (Resimler gönderiliyor)';
            alertBox.style.display = 'block';
            alertBox.style.background = '#e0f2fe';
            alertBox.style.color = '#0284c7';
            alertBox.textContent = 'İşlem başladı, lütfen bekleyin...';

            try {
                // 1. Manşet Görselini Ayarla (Dosya seçildiyse yükle, yoksa linki al)
                let thumbUrl = document.getElementById('postThumbLink').value;
                const thumbFile = document.getElementById('postThumbFile').files[0];
                if(thumbFile) {
                    thumbUrl = await uploadImageToFirebase(thumbFile);
                }
                if(!thumbUrl) thumbUrl = "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800"; // Varsayılan

                // 2. Blokları Topla ve İçindeki Resimleri Yükle
                const blocks = [];
                const blockElements = document.querySelectorAll('.block-content-edit');
                
                for (let el of blockElements) {
                    const type = el.getAttribute('data-type');
                    
                    if (type === 'text') {
                        const val = el.querySelector('.block-val').value;
                        if(val) blocks.push({ type: "text", content: `<p>${val.replace(/\n/g, '<br>')}</p>` });
                    } 
                    else if (type === 'title2') {
                        const val = el.querySelector('.block-val').value;
                        if(val) blocks.push({ type: "text", content: `<h2>${val}</h2>` });
                    } 
                    else if (type === 'youtube') {
                        const val = el.querySelector('.block-val').value;
                        if(val) blocks.push({ type: "youtube", url: val });
                    }
                    else if (type === 'image') {
                        let imgUrl = el.querySelector('.block-link').value;
                        const imgFile = el.querySelector('.block-file').files[0];
                        if(imgFile) {
                            imgUrl = await uploadImageToFirebase(imgFile);
                        }
                        const caption = el.querySelector('.block-caption').value;
                        if(imgUrl) {
                            blocks.push({ type: "image", url: imgUrl, caption: caption });
                        }
                    }
                }

                // 3. Veritabanına (Firestore) Gönder
                const dateStr = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
                
                await addDoc(collection(db, "posts"), {
                    title: title,
                    category: document.getElementById('postCat').value,
                    isTrend: document.getElementById('postTrend').checked,
                    isHeadline: document.getElementById('postHeadline').checked,
                    date: dateStr,
                    createdAt: serverTimestamp(),
                    views: 0,
                    thumbnail: thumbUrl,
                    excerpt: document.getElementById('postExcerpt').value,
                    blocks: blocks
                });

                // Başarılı
                alertBox.style.background = '#dcfce7';
                alertBox.style.color = '#166534';
                alertBox.textContent = '✅ Haberin başarıyla Firebase bulutuna kaydedildi ve şu an canlıda!';
                btn.innerHTML = 'Yeni Haber Ekle';
                btn.disabled = false;
                
                // Formu temizle
                document.getElementById('postTitle').value = '';
                document.getElementById('postExcerpt').value = '';
                document.getElementById('postThumbFile').value = '';
                document.getElementById('postThumbLink').value = '';
                blocksContainer.innerHTML = '';
                addBlock('text');

            } catch (error) {
                console.error(error);
                alertBox.style.background = '#fee2e2';
                alertBox.style.color = '#991b1b';
                alertBox.textContent = '❌ Bir hata oluştu: ' + error.message;
                btn.innerHTML = 'Tekrar Dene';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
