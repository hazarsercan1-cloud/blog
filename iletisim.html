<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim — Windlevel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">💨</div>
                Windlevel
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Ana Sayfa</a>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 600px; padding-top: 40px; min-height: 60vh;">
        <h1 class="article-title" style="text-align: center; margin-bottom: 20px;">Bize Ulaşın</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">Soru, görüş, öneri ve reklam talepleriniz için her zaman buradayız.</p>
        
        <div style="background: white; padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px;">✉️</div>
            <h2 style="font-family: var(--font-heading); font-size: 24px; color: var(--text-dark); margin-bottom: 12px;">E-Posta Adresimiz</h2>
            <p style="font-size: 16px; color: var(--text-body); margin-bottom: 24px;">Tüm mesajlarınıza en kısa sürede dönüş yapmaya çalışıyoruz.</p>
            
            <a href="mailto:info@windlevel.com" style="display: inline-block; padding: 16px 32px; background: var(--accent-light); color: var(--accent); font-size: 18px; font-weight: 700; border-radius: var(--radius-md); transition: 0.2s;">
                info@windlevel.com
            </a>
        </div>
    </main>

    <footer style="background: white; border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center;">
        <p style="font-size: 13px; color: #94a3b8;">© 2026 Windlevel. Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
